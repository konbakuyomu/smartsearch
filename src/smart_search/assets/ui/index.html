<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #646e7a;
  --line: #e2e6ea; --accent: #2f6feb; --ok: #1a7f46; --warn: #a3671a; --bad: #c0392b;
  --chip: #eef1f5; --shadow: 0 1px 2px rgba(16,22,26,.06), 0 4px 16px rgba(16,22,26,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171a; --panel: #1c2025; --ink: #e7eaee; --muted: #98a2ad;
    --line: #2a3039; --accent: #6ea0ff; --ok: #4ec27f; --warn: #d7a34a; --bad: #f0776a;
    --chip: #252b33; --shadow: none;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
}
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.layout { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
nav {
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 20px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
nav h1 { font-size: 15px; margin: 0 0 4px 8px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
nav h1 img { width: 36px; height: 36px; padding: 2px; background: white; border-radius: 6px; }
nav .sub { font-size: 12px; color: var(--muted); margin: 0 0 18px 8px; }
nav button {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  padding: 8px 10px; border-radius: 7px; color: var(--ink); cursor: pointer;
  font: inherit; font-size: 14px; margin-bottom: 2px;
}
nav button:hover { background: var(--chip); }
nav button[aria-current="true"] { background: var(--accent); color: #fff; }
main { padding: 28px 32px 80px; max-width: 900px; }
h2 { font-size: 20px; margin: 0 0 6px; }
.blurb { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.card h3 { margin: 0 0 2px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card .note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.card .provider-guidance {
  color: var(--muted); font-size: 12px; margin: 0 0 12px; padding: 8px 10px;
  border-left: 2px solid var(--accent); background: var(--bg); border-radius: 4px;
}
.banner { border-left: 3px solid var(--accent); }
.banner.ok { border-left-color: var(--ok); }
.banner.bad { border-left-color: var(--bad); }
.pill {
  display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
  background: var(--chip); color: var(--muted); white-space: nowrap;
}
.pill:empty { display: none; }
.pill.ok { background: rgba(26,127,70,.14); color: var(--ok); }
.pill.bad { background: rgba(192,57,43,.14); color: var(--bad); }
.pill.warn { background: rgba(163,103,26,.16); color: var(--warn); }
.row {
  display: grid; grid-template-columns: 200px 1fr auto; gap: 10px;
  align-items: start; padding: 9px 0; border-top: 1px solid var(--line);
}
.row:first-of-type { border-top: 0; }
.row label { font-size: 14px; }
.row .help { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.row .val { font-size: 13px; word-break: break-all; }
.row .val .unset { color: var(--muted); }
button.act {
  background: var(--accent); color: #fff; border: 0; border-radius: 7px;
  padding: 6px 13px; font: inherit; font-size: 13px; cursor: pointer;
}
button.act.ghost { background: var(--chip); color: var(--ink); }
button.act[disabled] { opacity: .5; cursor: not-allowed; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; border-top: 0; }
input[type="text"], input[type="password"], select {
  width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink); font: inherit; font-size: 13px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input[disabled], select[disabled] { opacity: .6; cursor: not-allowed; }
input.dirty, select.dirty { border-color: var(--accent); }
.savebar {
  position: sticky; bottom: 0; margin: 20px -32px -80px; padding: 12px 32px;
  background: var(--panel); border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; z-index: 5;
}
.savebar .grow { flex: 1; font-size: 13px; color: var(--muted); }
.steps { counter-reset: step; }
.step > h3::before {
  counter-increment: step; content: counter(step);
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
  color: #fff; font-size: 12px; margin-right: 2px;
}
.step.done > h3::before { background: var(--ok); content: "✓"; }
details.more { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
details.more > summary {
  cursor: pointer; color: var(--muted); font-size: 13px; list-style: none;
  padding: 2px 0; user-select: none;
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "▸ "; }
details.more[open] > summary::before { content: "▾ "; }
.links { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.links a {
  color: var(--accent); font-size: 12px; text-decoration: none;
  border-bottom: 1px dotted var(--accent);
}
.links a:hover { border-bottom-style: solid; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--bg); color: var(--muted);
  border-radius: 999px; padding: 3px 11px; font: inherit; font-size: 12px; cursor: pointer;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip[disabled] { cursor: not-allowed; opacity: .5; }
.chips.dirty .chip.on { outline: 1px solid var(--accent); }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.chain .arrow { color: var(--muted); font-size: 12px; }
.cost {
  font-size: 12px; color: var(--warn); background: rgba(163,103,26,.1);
  border-radius: 6px; padding: 7px 10px; margin-bottom: 12px;
}
.toast {
  position: fixed; right: 20px; bottom: 20px; background: var(--panel);
  border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 10px 14px; box-shadow: var(--shadow);
  font-size: 13px; max-width: 380px; opacity: 0; transition: opacity .15s; pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.bad { border-left-color: var(--bad); }
.lang { float: right; }
.lang button { display: inline; width: auto; padding: 2px 8px; font-size: 12px; }
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; height: auto; }
  main { padding: 20px 16px 60px; }
  .row { grid-template-columns: 1fr; }
  .savebar { margin: 20px -16px -60px; padding: 12px 16px; flex-wrap: wrap; }
}
</style>
</head>

    return (n / 3600).toFixed(1) + "h";

  function providerCard(provider, fields) {
    var health = ((state.provider_health || {}).providers || []).filter(function (item) {

    var probe = (state.probe_kinds || {})[provider] || "";

      ])
    ];
    var profile = (state.provider_profiles || {})[provider] || {};
    var descriptions = profile.descriptions || {};
    function localizedDescriptions(prefix) {
      return ["search", "fetch", "site_map", "synthesis"].map(function (operation) {
        var translations = descriptions[operation] || {};
        return translations[prefix + lang] || translations[prefix + "en"] || "";
      }).filter(Boolean).join(" ");

    upfront.forEach(function (field) { kids.push(editableRow(field)); });

        })
      ]));
    }
    return el("div", { class: "card" }, kids);

  var pending = {};          // KEY -> new string value ("" means clear)
  var previewTimer = null;

  function isDirty() { return Object.keys(pending).length > 0; }

  function effectiveValues() {
    // Truthiness is all capability_status_from_values looks at, so a masked
    // placeholder stands in fine for a secret we are not allowed to read back.
    var merged = {};
    Object.keys(state.values || {}).forEach(function (key) { merged[key] = state.values[key]; });
    Object.keys(pending).forEach(function (key) { merged[key] = pending[key]; });
    return merged;
  }

  function markDirty(field, input, value) {
    var saved = (state.values || {})[field.key] || "";
    if (value === saved || (value === "" && (!saved || field.kind === "secret"))) delete pending[field.key];
    else pending[field.key] = value;
    input.className = pending.hasOwnProperty(field.key) ? "dirty" : "";
    updateSaveBar();
    clearTimeout(previewTimer);
    previewTimer = setTimeout(runPreview, 350);
  }

  function runPreview() {
    api("POST", "/api/preview", { values: effectiveValues() }).then(function (data) {
      if (!data || !data.ok) return;
      var node = document.getElementById("previewMeter");
      if (!node) return;
      node.className = "pill " + (data.minimum_profile_ok ? "ok" : "bad");
      node.textContent = data.minimum_profile_ok
        ? t("ready")
        : t("notReady") + (data.missing.length ? " · " + data.missing.join(", ") : "");
      document.querySelectorAll("[data-step]").forEach(function (card) {
        var name = card.getAttribute("data-step");
        var ok = (data.capability_status[name] || {}).ok;
        card.className = "card step" + (ok ? " done" : "");
      });
    });
  }

  function updateSaveBar() {
    var bar = document.getElementById("saveBar");
    if (!bar) return;
    var count = Object.keys(pending).length;
    bar.style.display = count ? "flex" : "none";
    var label = document.getElementById("saveCount");
    if (label) label.textContent = count ? t("unsaved").replace("{n}", count) : "";
  }

  function saveChanges() {
    if (!isDirty()) return;
    var setValues = {}, unsetKeys = [];
    Object.keys(pending).forEach(function (key) {
      if (pending[key] === "") unsetKeys.push(key);
      else setValues[key] = pending[key];
    });
    var button = document.getElementById("saveBtn");
    if (button) button.disabled = true;
    api("POST", "/api/config", { set: setValues, unset: unsetKeys, revision: state.revision }).then(function (data) {
      if (!data.ok) { toast(data.error || "failed", true); return; }
      pending = {};
      if (data.status) { Object.keys(data.status).forEach(function (k) { state[k] = data.status[k]; }); }
      toast(t("saved"));
      render();
    }).catch(function (e) {
      toast(String(e), true);
    }).then(function () {
      if (button) button.disabled = false;
    });
  }

  function saveBar() {
    return el("div", { class: "savebar", id: "saveBar", style: "display:none" }, [
      el("span", { class: "grow", id: "saveCount" }),
      el("button", {
        class: "act ghost", type: "button", text: t("discard"),
        onclick: function () { pending = {}; render(); }
      }),
      el("button", { class: "act", type: "button", id: "saveBtn", text: t("save"), onclick: saveChanges })
    ]);
  }

  function fieldInput(field) {
    var source = (state.sources || {})[field.key] || "default";
    var saved = (state.values || {})[field.key] || "";
    var locked = source === "environment";
    var value = pending.hasOwnProperty(field.key) ? pending[field.key] : saved;

    if (field.kind === "enum" || field.kind === "bool") {
      var options = field.kind === "bool" ? ["true", "false"] : field.choices;
      var select = el("select", locked ? { disabled: "disabled" } : {});
      select.appendChild(el("option", { value: "", text: "(" + t("def") + (field.default ? " " + field.default : "") + ")" }));
      options.forEach(function (option) {
        select.appendChild(el("option", { value: option, text: option }));
      });
      select.value = value;
      if (!locked) select.addEventListener("change", function () { markDirty(field, select, select.value); });
      if (pending.hasOwnProperty(field.key)) select.className = "dirty";
      return select;
    }

    if (field.kind === "csv" && field.key.indexOf("RESEARCH_") >= 0) {
      var chosen = {};
      value.split(",").forEach(function (item) {
        item = item.trim();
        if (item) chosen[item] = true;
      });
      var wrap = el("div", { class: "chips" });
      Object.keys(state.provider_profiles || {}).sort().forEach(function (provider) {
        var on = !!chosen[provider];
        var chip = el("button", {
          type: "button", class: "chip" + (on ? " on" : ""), text: provider,
          disabled: locked ? "disabled" : null
        });
        chip.addEventListener("click", function () {
          if (locked) return;
          if (chosen[provider]) delete chosen[provider]; else chosen[provider] = true;
          chip.className = "chip" + (chosen[provider] ? " on" : "");
          markDirty(field, wrap, Object.keys(chosen).sort().join(","));
        });
        wrap.appendChild(chip);
      });
      return wrap;
    }

    var secret = field.kind === "secret";
    var input = el("input", {
      type: secret ? "password" : "text",
      autocomplete: secret ? "new-password" : "off",
      spellcheck: "false",
      placeholder: secret && saved ? saved : (field.placeholder || field.default || "")
    });
    // A saved secret is only ever shown masked; leaving the box empty keeps it.
    input.value = secret ? (pending.hasOwnProperty(field.key) ? pending[field.key] : "") : value;
    if (locked) { input.disabled = true; input.value = secret ? "" : saved; }
    else input.addEventListener("input", function () { markDirty(field, input, input.value); });
    if (pending.hasOwnProperty(field.key)) input.className = "dirty";
    return input;
  }

  function editableRow(field) {
    var source = (state.sources || {})[field.key] || "default";
    var saved = (state.values || {})[field.key] || "";
    var locked = source === "environment";
    var input = fieldInput(field);
    var side = [el("span", { class: "pill", text: sourceLabel(source) })];
    if (locked) side.push(el("span", { class: "pill warn", text: t("envLocked") }));
    else if (saved) side.push(el("button", {
      class: "act ghost", type: "button", text: t("clear"),
      onclick: function () {
        pending[field.key] = "";
        render();
        clearTimeout(previewTimer);
        previewTimer = setTimeout(runPreview, 50);
      }
    }));
    var links = null;
    if (field.key_url || field.docs_url) {
      links = el("div", { class: "links" }, [
        field.key_url ? el("a", {
          href: field.key_url, target: "_blank", rel: "noopener noreferrer",
          text: t("getKey") + " ↗"
        }) : null,
        field.docs_url ? el("a", {
          href: field.docs_url, target: "_blank", rel: "noopener noreferrer",
          text: t("readDocs") + " ↗"
        }) : null
      ]);
    }
    return el("div", { class: "row" }, [
      el("div", {}, [
        el("label", { text: L(field, "label") }),
        el("span", { class: "help mono", text: field.key }),
        L(field, "help") ? el("span", { class: "help", text: L(field, "help") }) : null,
        locked ? el("span", { class: "help", text: t("envHint") + " unset " + field.key }) : null,
        links
      ]),
      el("div", {}, [input]),
      el("div", {}, side)
    ]);
  }

  function runTest(provider) {
    if (testing[provider]) return;
    testing[provider] = true;
    var button = document.getElementById("btn-" + provider);
    var result = document.getElementById("res-" + provider);
    if (button) { button.disabled = true; button.textContent = t("testing"); }
    if (result) { result.className = "pill"; result.textContent = "…"; }
    var shared = (state.probe_kinds[provider] || "").replace(/^shared:/, "");
    var overrides = {};
    state.metadata.fields.forEach(function (field) {
      if ((field.provider === provider || field.provider === shared) && pending.hasOwnProperty(field.key)) {
        overrides[field.key] = pending[field.key];
      }
    });
    api("POST", "/api/test", { provider: provider, overrides: overrides }).then(function (data) {
      var good = data.status === "ok";
      var neutral = data.status === "configured" || data.status === "not_configured";
      if (result) {
        result.className = "pill " + (good ? "ok" : (neutral ? "warn" : "bad"));
        result.textContent = data.status + (data.response_time_ms ? " · " + Math.round(data.response_time_ms) + "ms" : "");
      }
      toast(provider + ": " + (data.message || data.status), !good && !neutral);
      return api("GET", "/api/status");
    }).then(function (fresh) {
      if (fresh && fresh.ok) { Object.keys(fresh).forEach(function (k) { state[k] = fresh[k]; }); }
    }).catch(function (e) {
      toast(String(e), true);
    }).then(function () {
      testing[provider] = false;
      if (button) { button.disabled = false; button.textContent = t("test"); }
    });
  }

      class: "mono", style: "white-space:pre-wrap;word-break:break-word;margin:0;font-size:12px"
    });
    var outputCard = el("div", { class: "card", style: "display:none" }, [
      el("h3", { text: t("result") }), output
    ]);

    function run(command) {
      var query = box.value.trim();
      if (!query) { toast(t("needQuery"), true); return; }
      if (command === "search" && !window.confirm(t("searchCost"))) return;
      outputCard.style.display = "";
      output.textContent = t("running");
      api("POST", "/api/run", { command: command, query: query }).then(function (data) {
        output.textContent = JSON.stringify(data, null, 2);
        if (!data.ok) toast(data.error || "failed", true);
      }).catch(function (e) { output.textContent = String(e); });
    }

    main.appendChild(el("div", { class: "card" }, [
      el("div", { class: "row", style: "grid-template-columns:1fr" }, [el("div", {}, [box])]),
      el("p", { class: "note", style: "margin:12px 0 0;display:flex;gap:8px;flex-wrap:wrap" }, [
        el("button", { class: "act", type: "button", text: t("runRoute"), onclick: function () { run("route"); } }),
        el("button", { class: "act ghost", type: "button", text: t("runSearch"), onclick: function () { run("search"); } })
      ])
    ]));
    main.appendChild(outputCard);
    box.addEventListener("keydown", function (event) { if (event.key === "Enter") run("route"); });
  }

  function chainCard() {
    var chains = state.capability_chains || {};
    var caps = state.capability_status || {};
    var cooling = {};
    ((state.provider_health || {}).providers || []).forEach(function (item) {
      if (item.state === "cooldown") cooling[item.provider] = true;
    });
    var rows = Object.keys(chains).filter(function (name) { return caps[name]; }).map(function (name) {
      var configured = (caps[name] || {}).configured || [];
      var steps = [];
      chains[name].forEach(function (provider, index) {
        if (index) steps.push(el("span", { class: "arrow", text: "→" }));
        var cls = cooling[provider] ? "bad" : (configured.indexOf(provider) >= 0 ? "ok" : "");
        steps.push(el("span", {
          class: "pill " + cls,
          title: cooling[provider] ? t("cooldown") : "",
          text: provider + (cooling[provider] ? " ✕" : "")
        }));
      });
      return el("tr", {}, [
        el("td", { class: "mono", text: name }),
        el("td", { class: "chain" }, steps)
      ]);
    });
    return el("div", { class: "card" }, [
      el("h3", { text: t("chain") }),
      el("p", { class: "note", text: t("chainNote") }),
      el("table", {}, [el("tbody", {}, rows)])
    ]);
  }

  function sectionById(id) {
    var found = state.metadata.sections.filter(function (item) { return item.id === id; })[0];
    return found || { label_zh: id, label_en: id, blurb_zh: "", blurb_en: "" };
  }

  // ---- shell ------------------------------------------------------------
  function renderNav() {
    var nav = document.getElementById("nav");
    nav.textContent = "";
    document.getElementById("subtitle").textContent = t("sub");
    state.metadata.sections.forEach(function (section) {
      nav.appendChild(el("button", {
        type: "button", text: L(section, "label"),
        "aria-current": section.id === current ? "true" : "false",
        onclick: function () {
          if (isDirty() && !window.confirm(t("discard") + "?")) return;
          pending = {};
          current = section.id;
          render();
        }
      }));
    });
  }

  function render() {
    renderNav();
    var main = document.getElementById("main");
    main.textContent = "";
    if (current === "status") viewStatus();
    else if (current === "getting_started") viewGettingStarted();
    else if (current === "providers") viewProviders();
    else if (current === "skills") viewSkills();
    else if (current === "tryit") viewTryIt();
    else viewSection(current);
    window.scrollTo(0, 0);
  }

  function refresh() {
    return api("GET", "/api/status").then(function (data) {
      if (data && data.ok) {
        Object.keys(data).forEach(function (key) { state[key] = data[key]; });
        render();
      }
    });
  }

  document.getElementById("langToggle").addEventListener("click", function () {
    lang = lang === "zh" ? "en" : "zh";
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    render();
  });

  window.setInterval(function () { api("POST", "/api/heartbeat", {}); }, 30000);

  api("GET", "/api/state").then(function (data) {
    if (!data || !data.ok) {
      document.getElementById("main").textContent = (data && data.error) || "failed to load";
      return;
    }
    state = data;
    current = "status";
    render();
  });
})();
</script>
</body>
</html>
