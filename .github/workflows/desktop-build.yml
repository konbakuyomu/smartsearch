name: Desktop test packages

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - "desktop/**"
      - "pyproject.toml"
      - "src/smart_search/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing stable vX.Y.Z tag: build all packages and attach them with SHA256SUMS to that release"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          run-id: 35502967876
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-packages
          merge-multiple: true
      - name: Validate version, platforms and checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Only stable version tags are accepted'
          version = json.loads(pathlib.Path('package.json').read_text())['version']
          assert tag == 'v' + version, 'Tag and source package version differ'
          expected = {f'SmartSearch-{version}-win-{a}-Setup-unsigned-test.exe' for a in ('x64', 'arm64')}
          expected |= {f'SmartSearch-{version}-macos-{a}-unsigned-test.dmg' for a in ('x86_64', 'arm64')}
          root = pathlib.Path('release-packages')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          assert len(files) == len(expected) and {p.name for p in files} == expected, 'Missing or unexpected platform packages'
          for p in files:
              if p.parent != root:
                  p.rename(root / p.name)
          files = sorted(root / name for name in expected)
          rows = [hashlib.file_digest(p.open('rb'), 'sha256').hexdigest() + '  ' + p.name for p in files]
          (root / 'SHA256SUMS.txt').write_text('\n'.join(rows) + '\n')
          PY
      - name: Attach complete unsigned packages to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          repo, tag = os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/392382704']))
          assert release['tag_name'] == tag == 'v0.1.20'
          existing = {asset['name']: asset for asset in release['assets']}
          files = [p for p in pathlib.Path('release-packages').iterdir() if p.is_file()]
          assert len(files) == 5
          for p in files:
              digest = 'sha256:' + hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()
              if p.name in existing:
                  assert existing[p.name]['state'] == 'uploaded' and existing[p.name]['digest'] == digest, p.name
              else:
                  subprocess.run(['gh', 'release', 'upload', tag, str(p), '--repo', repo], check=True)
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--latest', '--repo', repo], check=True)
          PY
